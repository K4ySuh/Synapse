# Installed-package Codex default. Replace every /private or /operator path.
# Preferred operator-selected model for an assessment: gpt-daybreak-blue-latest
# with High reasoning when available. Choose it in the client; this MCP server
# profile does not change the user's global model setting.
[mcp_servers.synapse]
command = "/absolute/path/to/venv/bin/synapse-mcp-modern"
args = [
  "--surface", "modern-compact",
  "--transport", "stdio",
  "--server-name", "synapse",
  "--audience", "synapse",
  "--identity-bindings", "/private/path/identity-bindings.json",
  "--stdio-principal", "local-operator",
  "--request-state-keyring", "/private/path/request-state-keyring.json",
  "--state-dir", "/operator/path/Synapse/DATA/modern-adapter/state"
]
required = true
default_tools_approval_mode = "approve"
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.synapse.env]
SYNAPSE_ROOT = "/operator/path/Synapse"
SYNAPSE_DATA_DIR = "/operator/path/Synapse/DATA"
