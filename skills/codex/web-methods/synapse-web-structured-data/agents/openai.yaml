interface:
  display_name: "Synapse Structured Data"
  short_description: "Analyze GraphQL and serialized-data evidence"
  default_prompt: "Use $synapse-web-structured-data to analyze the selected GraphQL or serialization question from saved Synapse evidence."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "synapse"
      description: "Local Synapse MCP server for scoped context, evidence, and guarded execution."
