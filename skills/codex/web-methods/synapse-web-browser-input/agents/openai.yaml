interface:
  display_name: "Synapse Browser Input"
  short_description: "Analyze browser input and redirect evidence"
  default_prompt: "Use $synapse-web-browser-input to analyze the selected browser input or redirect question from saved Synapse evidence."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "synapse"
      description: "Local Synapse MCP server for scoped context, evidence, and guarded execution."
