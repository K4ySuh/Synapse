interface:
  display_name: "Synapse Business Logic"
  short_description: "Analyze workflow and business-rule evidence"
  default_prompt: "Use $synapse-web-business-logic to analyze the selected workflow, ordering, concurrency, or business-rule question from saved Synapse evidence."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "synapse"
      description: "Local Synapse MCP server for scoped context, evidence, and guarded execution."
