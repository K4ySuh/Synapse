interface:
  display_name: "Synapse Auth and Session"
  short_description: "Analyze authentication and session evidence"
  default_prompt: "Use $synapse-web-auth-session to analyze the selected authentication or session question from saved Synapse evidence."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "synapse"
      description: "Local Synapse MCP server for scoped context, evidence, and guarded execution."
