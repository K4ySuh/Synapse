interface:
  display_name: "Synapse Web Configuration"
  short_description: "Analyze web security configuration evidence"
  default_prompt: "Use $synapse-web-configuration to analyze the selected header, CORS, cookie, TLS, or configuration question from saved Synapse evidence."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "synapse"
      description: "Local Synapse MCP server for scoped context, evidence, and guarded execution."
