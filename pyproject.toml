[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-mcp"
version = "0.6.0b0"
description = "Local MCP tooling for authorized security assessment workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Javier Roldán Ortiz" },
    { name = "Synapse contributors" },
]
keywords = ["mcp", "security", "burp", "assessment", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.44,<2",
    "selenium>=4.20,<5",
]
modern = [
    "mcp==2.0.0",
]
state-v2 = [
    # Maintained SQLite binding for Python runtimes whose stdlib sqlite3 is
    # linked below the State Store v2 WAL safety floor.
    "apsw==3.53.4.0",
]
modern-spike = [
    # Deprecated compatibility alias; use the production `modern` extra.
    "mcp==2.0.0",
]

[project.scripts]
synapse-mcp = "synapse_mcp.transport.stdio_server:main"
synapse-mcp-modern = "synapse_mcp.transport.modern.__main__:main"
synapse-mcp-modern-spike = "synapse_mcp.transport.modern_spike:main"
synapse-authority = "synapse_mcp.policy.operator_cli:main"
synapse-state = "synapse_mcp.state.cli:main"
synapse-codex-assets = "synapse_mcp.integrations.codex:main"

[tool.setuptools.packages.find]
where = ["MCPS/Synapse-MCP"]
include = ["synapse_mcp*"]

[tool.setuptools.package-data]
synapse_mcp = [
    "operational_prompt.md",
    "app/actions/action_inventory.json",
    "app/actions/output_contracts.json",
    "state/migrations/*.sql",
    "core/documentation/html_templates/*.html",
    "core/documentation/html_templates/*.md",
]

[tool.setuptools.data-files]
"share/synapse-mcp/codex/config" = ["config/codex/*.toml"]
"share/synapse-mcp/codex/skills/default/operate-synapse" = ["skills/codex/default/operate-synapse/SKILL.md"]
"share/synapse-mcp/codex/skills/default/operate-synapse/agents" = ["skills/codex/default/operate-synapse/agents/openai.yaml"]
"share/synapse-mcp/codex/skills/default/operate-synapse/references" = ["skills/codex/default/operate-synapse/references/*.md"]
"share/synapse-mcp/codex/skills/default/synapse-web-pentesting" = ["skills/codex/default/synapse-web-pentesting/SKILL.md"]
"share/synapse-mcp/codex/skills/default/synapse-web-pentesting/agents" = ["skills/codex/default/synapse-web-pentesting/agents/openai.yaml"]
"share/synapse-mcp/codex/skills/default/synapse-web-pentesting/references" = ["skills/codex/default/synapse-web-pentesting/references/*.md"]
"share/synapse-mcp/codex/skills/default/synapse-cve-intelligence" = ["skills/codex/default/synapse-cve-intelligence/SKILL.md"]
"share/synapse-mcp/codex/skills/default/synapse-cve-intelligence/agents" = ["skills/codex/default/synapse-cve-intelligence/agents/openai.yaml"]
"share/synapse-mcp/codex/skills/default/synapse-cve-intelligence/references" = ["skills/codex/default/synapse-cve-intelligence/references/*.md"]
"share/synapse-mcp/codex/skills/multi-agent-compat/operate-synapse" = ["skills/codex/multi-agent-compat/operate-synapse/SKILL.md"]
"share/synapse-mcp/codex/skills/multi-agent-compat/operate-synapse/agents" = ["skills/codex/multi-agent-compat/operate-synapse/agents/openai.yaml"]
"share/synapse-mcp/codex/skills/multi-agent-compat/operate-synapse/references" = ["skills/codex/multi-agent-compat/operate-synapse/references/*.md"]
"share/synapse-mcp/codex/skills/multi-agent-compat/synapse-coordinate-engagement" = ["skills/codex/multi-agent-compat/synapse-coordinate-engagement/SKILL.md"]
"share/synapse-mcp/codex/skills/multi-agent-compat/synapse-coordinate-engagement/agents" = ["skills/codex/multi-agent-compat/synapse-coordinate-engagement/agents/openai.yaml"]
"share/synapse-mcp/codex/skills/multi-agent-compat/synapse-engagement-bootstrap" = ["skills/codex/multi-agent-compat/synapse-engagement-bootstrap/SKILL.md"]
"share/synapse-mcp/codex/skills/multi-agent-compat/synapse-engagement-bootstrap/agents" = ["skills/codex/multi-agent-compat/synapse-engagement-bootstrap/agents/openai.yaml"]
"share/synapse-mcp/codex/skills/multi-agent-compat/synapse-perimeter-triage" = ["skills/codex/multi-agent-compat/synapse-perimeter-triage/SKILL.md"]
"share/synapse-mcp/codex/skills/multi-agent-compat/synapse-perimeter-triage/agents" = ["skills/codex/multi-agent-compat/synapse-perimeter-triage/agents/openai.yaml"]
"share/synapse-mcp/codex/skills/multi-agent-compat/synapse-web-assessment" = ["skills/codex/multi-agent-compat/synapse-web-assessment/SKILL.md"]
"share/synapse-mcp/codex/skills/multi-agent-compat/synapse-web-assessment/agents" = ["skills/codex/multi-agent-compat/synapse-web-assessment/agents/openai.yaml"]
"share/synapse-mcp/codex/skills/multi-agent-compat/synapse-access-control" = ["skills/codex/multi-agent-compat/synapse-access-control/SKILL.md"]
